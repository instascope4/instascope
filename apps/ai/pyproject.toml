[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SudeGun", email = "gunduzsude16@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "bertopic>=0.17.3",
    "datasets>=4.5.0",
    "emoji>=2.15.0",
    "eval-type-backport>=0.4.0",
    "faker>=37.12.0",
    "fastapi>=0.128.8",
    "hdbscan>=0.8.44",
    "instaloader>=4.15.3",
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "protobuf>=6.33.6",
    "psycopg-pool>=3.2.8",
    "psycopg[binary]>=3.2.13",
    "pyarrow>=21.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.1.2",
    "sentencepiece>=0.2.2",
    "torch>=2.8.0",
    "transformers>=4.57.6",
    "umap-learn>=0.5.12",
    "uvicorn>=0.39.0",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "pytest>=9.1.1",
]

[tool.uv]
override-dependencies = [
    "setuptools>=78.1.1",
    "wheel>=0.46.2",
    "msgpack>=1.2.1",
    "jaraco.context>=6.1.0",
    "wheel>=0.46.2",
    "starlette>=1.0.1",
    "aiohttp>=3.14.1",
    "urllib3>=2.7.0",
    "requests>=2.33.0",
    "pillow>=12.3.0",
    "click>=8.3.3",
    "filelock>=3.20.3",
    "msgpack>=1.2.1",
    "bleach>=6.4.0",
    "jupyterlab>=4.6.2",
    "jupyter-server>=2.20.0",
    "pyarrow>=23.0.1",
    "setuptools>=78.1.1",
    "pip>=26.1.2",
    "python-dotenv>=1.2.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
