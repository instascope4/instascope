packages:
  - 'apps/web'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  es5-ext: false
  fsevents: false

overrides:
  multer: ">=2.2.0"
  lodash: ">=4.17.24"
  js-yaml: ">=4.3.1"
  brace-expansion: ">=5.0.9"
  fast-uri: ">=3.1.5"
  file-type: ">=21.3.2"
  qs: ">=6.15.2"
  body-parser: ">=1.20.6"
